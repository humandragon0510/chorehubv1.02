<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure List Fun</title>
    <style>
      :root {
        --omni: #009EDD;
        --zaia: #4e14e1;
        --bg: #00000000;
        --card: #ffffff;
        --text: #1e293b;
        --danger: #ef4444;
        --success: #22c55e;
        --warning: #f59e0b;
        --disabled: #cbd5e1;
        --lock: #64748b;
        --info: #0ea5e9;
      }

      body {
        font-family: 'Segoe UI', sans-serif;
        background: #000;
        margin: 0;
        padding: 20px;
        overflow-x: hidden;
        color: var(--text);
        animation: rainbowBackground 15s linear infinite;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        position: relative;
        z-index: 2;
      }

      #ambient-bg {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .ambient-item {
        position: absolute;
        font-size: 5rem;
        filter: drop-shadow(0 0 20px #EFFF00) drop-shadow(0 0 40px #FFD700);
        opacity: 0.85;
        animation: ambientFloat var(--dur) ease-in-out infinite alternate;
      }

      .hero-shell {
        display: flex;
        justify-content: center;
        margin-bottom: 18px;
      }

      .hero-card {
        position: relative;
        text-align: center;
        padding: 24px 56px;
        min-width: min(800px, 100%);
        max-width: 100%;
        border: 8px solid white;
        border-radius: 40px;
        background: rgba(0, 0, 0, 0.7);
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
      }

      .hero-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        flex-wrap: wrap;
      }

      .hero-title {
        color: white;
        font-size: clamp(2.5rem, 5vw, 5rem);
        font-weight: 900;
        line-height: 1.1;
        text-transform: uppercase;
        animation: gentlePulse 4s ease-in-out infinite alternate;
        letter-spacing: -2px;
        margin: 0;
        font-family: 'Arial Black', sans-serif;
      }

      .hero-emoji {
        display: inline-block;
        font-size: 3.75rem;
        animation: slowSpin 12s linear infinite;
      }

      .hero-subtitle {
        display: block;
        font-size: clamp(1.5rem, 3vw, 2.6rem);
        margin-top: 14px;
        letter-spacing: 0.45em;
        font-weight: 900;
        text-transform: uppercase;
        color: #FFFFFF;
        text-shadow: 2px 2px 0 #009EDD, 4px 4px 0 #BF00FF, 0 0 20px rgba(0, 0, 0, 1);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
        -webkit-background-clip: text;
        background-clip: text;
        animation: shine 3s linear infinite;
      }

      /* --- CELEBRATIONS & TROLL TAX --- */
      #celebration {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        text-align: center;
      }

      .theme-omni {
        background: #000;
        animation: hyperSpeed 0.4s linear infinite;
        background-image: radial-gradient(3px 3px at 20px 30px, #2dd4bf, rgba(0, 0, 0, 0)), radial-gradient(3px 3px at 40px 70px, #a855f7, rgba(0, 0, 0, 0));
      }

      .theme-zaia {
        background: #000;
        animation: disco 0.3s infinite;
      }

      .theme-troll {
        background: #450a0a;
        background-image: repeating-linear-gradient(45deg, #450a0a, #450a0a 10px, #7f1d1d 10px, #7f1d1d 20px);
        animation: trollShake 0.1s infinite;
      }

      @keyframes trollShake {
        0% { background-position: 0 0; }
        100% { background-position: 10px 10px; }
      }

      @keyframes disco {
        0% { background-color: #ff00ff; }
        33% { background-color: #00ffff; }
        66% { background-color: #ffff00; }
      }

      @keyframes hyperSpeed {
        from { background-position: 0 0; }
        to { background-position: 0 400px; }
      }

      @keyframes rainbowBackground {
        0% { background-color: #ff0000; }
        15% { background-color: #EFFF00; }
        30% { background-color: #00FF00; }
        45% { background-color: #009EDD; }
        60% { background-color: #139EFF; }
        75% { background-color: #BF00FF; }
        90% { background-color: #ec4899; }
        100% { background-color: #ff0000; }
      }

      @keyframes gentlePulse {
        from { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255,255,255,0.4)); }
        to { transform: scale(1.05); filter: drop-shadow(0 0 30px rgba(255,255,255,0.8)); }
      }

      @keyframes slowSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes shine {
        0% { background-position: -100%; }
        100% { background-position: 100%; }
      }

      @keyframes ambientFloat {
        from { transform: translateY(0) scale(0.95) rotate(-8deg); }
        to { transform: translateY(-20px) scale(1.05) rotate(8deg); }
      }

      .giant-text {
        font-size: 8rem;
        font-weight: 900;
        background: linear-gradient(#fff, #fbbf24);
        -webkit-background-clip: text;
        color: transparent;
        -webkit-text-stroke: 3px #000;
        animation: rumble 0.1s infinite;
        z-index: 1000;
      }

      @keyframes rumble {
        0% { transform: translate(3px, 3px); }
        50% { transform: translate(-3px, -3px); }
      }

      .flying-item {
        position: absolute;
        font-size: 6rem;
        pointer-events: none;
        animation: flyOut var(--d) linear infinite;
        z-index: 50;
      }

      @keyframes flyOut {
        0% {
          transform: scale(0.5) translate(-50%, -50%);
          opacity: 1;
          left: 50%;
          top: 55%;
        }
        100% {
          transform: scale(3) translate(var(--tx), var(--ty)) rotate(var(--rot));
          opacity: 0;
          left: 50%;
          top: 50%;
        }
      }

      /* --- UI ELEMENTS --- */
      .panel {
        background: rgba(255, 255, 255, 0.96);
        margin-bottom: 30px;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
      }

      .lock-overlay {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #f1f5f9;
        padding: 15px 25px;
        border-radius: 12px;
      }

      #passModal {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 10001;
        align-items: center;
        justify-content: center;
      }

      .modal-box {
        background: white;
        padding: 30px;
        border-radius: 20px;
        width: 350px;
        text-align: center;
      }

      .dashboard {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 30px;
      }

      .column {
        background: rgba(255, 255, 255, 0.96);
        border-radius: 24px;
        padding: 30px;
        border-top: 12px solid var(--accent);
      }

      .wallet-card {
        background: rgba(248, 250, 252, 0.96);
        border-radius: 15px;
        padding: 20px;
        margin: 10px 0;
        border: 2px solid #e2e8f0;
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 100px;
      }

      .left-stat {
        text-align: left;
        flex: 1;
      }

      .middle-stat {
        text-align: center;
        flex: 1;
      }

      .stat-val-large {
        font-size: 2.2rem;
        font-weight: 900;
        color: var(--text);
        line-height: 1;
      }

      .stat-val-mid {
        font-size: 1.8rem;
        font-weight: 900;
        color: var(--warning);
        line-height: 1;
      }

      .stat-label {
        font-size: 0.65rem;
        color: #64748b;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 5px;
        display: block;
      }

      .balance-container {
        position: absolute;
        top: -10px;
        right: 15px;
        text-align: right;
        background: var(--success);
        padding: 8px 12px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        color: white;
      }

      .balance-value {
        font-size: 1.4rem;
        font-weight: 900;
        display: block;
      }

      .chore-btn {
        width: 100%;
        padding: 15px;
        border: 3px solid #e2e8f0;
        border-radius: 15px;
        cursor: pointer;
        font-size: 1.1rem;
        font-weight: bold;
        margin-bottom: 10px;
        background: white;
        text-align: left;
        transition: transform 0.1s;
      }

      .chore-btn:active {
        transform: scale(0.98);
      }

      .chore-btn:disabled {
        background: #f1f5f9;
        border-color: #cbd5e1;
        color: #94a3b8;
        cursor: not-allowed;
        opacity: 0.7;
      }

      .chore-btn.spending {
        border-color: var(--warning);
        background: #fffcf0;
      }

      .history-item {
        background: rgba(248, 250, 252, 0.96);
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 12px;
        position: relative;
      }

      .status-tag {
        font-size: 0.7rem;
        padding: 4px 8px;
        border-radius: 6px;
        font-weight: 800;
        float: right;
        text-transform: uppercase;
      }

      .status-approved { background: #dcfce7; color: #166534; }
	.status-partial { background: #e0f2fe; color: #0369a1; }
.status-pending { background: #82FF59; color: #92400e; }

@media (max-width: 900px) {

.modal-box { width: calc(100vw - 20px); padding: 20px; }
.stat-val-large { font-size: 1.8rem; }
.stat-val-mid { font-size: 1.4rem; }
.chore-btn { padding: 13px; font-size: 1rem; }
.master-table, .master-table thead, .master-table tbody, .master-table th, .master-table td, .master-table tr {
display: block; width: 100%;
}
.master-table thead { display: none; }
.master-table tr { margin-bottom: 14px; padding: 12px; background: #f8fafc; border-radius: 14px; border: 1px solid #e2e8f0; }

.master-table td input, .master-table td select, .master-table td button { width: 100%; }
.master-table td button { padding: 10px; }
.history-item { padding: 12px; }
}
